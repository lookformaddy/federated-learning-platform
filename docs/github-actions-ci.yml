# GitHub Actions CI for federated-learning-platform.
# Ships under docs/ because this integration cannot push .github/workflows/.
# To activate: move this file to .github/workflows/ci.yml in the repo.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Run demo
        run: python demo.py
